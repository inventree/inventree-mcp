#This file is used to package the InvenTreeMCP plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.20.0
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-mcp"
description = "MCP server for InvenTree"
dynamic = ["version"]
authors = [
    { name = "Oliver Walters",email = "admin@inventree.org" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    # mcp 2.0.0 was a breaking rewrite (mcp.server.fastmcp -> mcp.server.mcpserver)
    "mcp>=2.0,<3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]
[project.optional-dependencies]
test = ["coverage"]

[project.urls]
Homepage = "https://github.com/inventree/inventree-mcp"

[project.entry-points."inventree_plugins"]
InvenTreeMCP = "inventree_mcp.core:InvenTreeMCP"

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.dynamic]
version = {attr = "inventree_mcp.PLUGIN_VERSION"} 

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["inventree_mcp"]

[tool.coverage.run]
source = ["inventree_mcp"]
omit = ["*/test_mcp.py"]
